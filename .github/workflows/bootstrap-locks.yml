# Temporary trusted-branch bootstrap. Removed before the final pull request is merged.
# Never runs on pull_request; never handles fork code with a write token.
name: Bootstrap lockfiles (temporary)
on:
  push:
    branches: [ci/permora-verification]
permissions:
  contents: write
concurrency:
  group: bootstrap-permora-lockfiles
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'Cenn0/Permora'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve actual NuGet locks
        run: dotnet restore Permora.slnx --use-lock-file --verbosity minimal
      - name: Resolve and validate actual npm lock
        working-directory: web
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Verify all lockfiles exist
        run: python3 scripts/ci-require-locks.py
      - name: Commit only resolved locks, never personal author metadata
        shell: bash
        run: |
          git add web/package-lock.json src/*/packages.lock.json tests/*/packages.lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: commit resolved npm and NuGet dependency locks'
          git push origin HEAD:refs/heads/ci/permora-verification
