name: Permora accessibility acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: permora-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve initial isolated axe tool lock (temporary bootstrap)
        run: |
          npm install --prefix tools/accessibility --package-lock-only --ignore-scripts
          cat tools/accessibility/package-lock.json
      - name: Install isolated test dependencies
        run: |
          npm ci --prefix tools/accessibility --ignore-scripts
          npm ci --prefix web
      - name: Install Chromium
        working-directory: web
        run: npx playwright install chromium --with-deps
      - name: Check rendered views, editors, keyboard and reflow
        working-directory: web
        run: npx playwright test --config playwright.accessibility.config.ts --max-failures=5
      - name: Explain scope without retaining screenshots or personal data
        if: always()
        run: |
          echo 'Automated axe-core WCAG A/AA checks, synthetic data, desktop/mobile/320px reflow and keyboard probes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Incomplete checks require human review. No claim of complete WCAG conformance or independent screenreader approval.' >> "$GITHUB_STEP_SUMMARY"
