name: Permora system acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permora-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  federation:
    name: Real LDAPS and FGAP with imported and non-imported users
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Build real worker and Portal API for joined federation acceptance
        run: |
          dotnet restore src/Permora.Worker/Permora.Worker.csproj --locked-mode
          dotnet restore src/Permora.Api/Permora.Api.csproj --locked-mode
          dotnet build src/Permora.Worker/Permora.Worker.csproj -c Release --no-restore
          dotnet build src/Permora.Api/Permora.Api.csproj -c Release --no-restore
      - name: Install isolated LDAP server and clients
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq slapd ldap-utils acl
          sudo systemctl stop slapd
          # The distribution data parent is not traversable by the runner account.
          # Grant traversal only, not access to other LDAP data or any secret file.
          sudo setfacl -m "u:$(id -un):--x" /var/lib/ldap
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /var/lib/ldap/permora-ci
          test -x /var/lib/ldap/permora-ci
      - name: Validate test syntax
        run: |
          python3 -m py_compile scripts/ci-federation.py scripts/ci_federation_worker.py scripts/ci_federation_faults.py
          python3 -m unittest discover -s scripts -p test_ci_federation_faults.py
      - name: Execute real LDAPS federation and delegated security matrix
        env:
          PERMORA_SYSTEM_TESTS: isolated
          PERMORA_FEDERATION_WORKER: isolated
          TMPDIR: /var/lib/ldap/permora-ci
        run: python3 scripts/ci-federation.py
      - name: Record scope without storing secrets or artifacts
        if: always()
        run: |
          echo 'Real OpenLDAP/LDAPS + Keycloak 26.8.1 + PostgreSQL 18 + built Permora.Worker and API in both imported/non-imported modes. SoD, LDAP timeout, duplicate directory page, corrupt ambiguous ID, HTTP 503, committed DELETE/reply loss and restart; independent remote readback.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Portal HTTP admission/retry uses explicit loopback Development authentication, not OIDC/MFA. New group grants stay disabled; revocations remain possible. Token Groups.manage overbreadth remains unresolved (#46).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Not Microsoft AD, Kerberos, corporate IAM, multi-host HA or production approval. No test secrets or backups are uploaded.' >> "$GITHUB_STEP_SUMMARY"
  system-gate:
    name: Required system acceptance gate
    if: always()
    needs: [federation]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Fail on failure, cancellation or skipped acceptance
        env:
          FEDERATION: ${{ needs.federation.result }}
        run: test "$FEDERATION" = success
