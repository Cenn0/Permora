name: Public documentation
on:
  pull_request:
    paths:
      - "*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/public-docs.yml"
      - "scripts/check_public_docs.py"
      - "scripts/test_public_docs_policy.py"
  push:
    branches: [main]
    paths:
      - "*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/public-docs.yml"
      - "scripts/check_public_docs.py"
      - "scripts/test_public_docs_policy.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate public README and local links
        run: python3 scripts/check_public_docs.py
      - name: Verify documentation privacy guards
        run: python3 -m unittest discover -s scripts -p 'test_public_docs_policy.py' -v
