name: Permora CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structure and frontend logic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate repository and CI contract
        run: python3 scripts/check-repository.py
      - name: Check shell and Python syntax
        run: |
          bash -n scripts/check.sh scripts/bootstrap-locks.sh
          python3 -m compileall -q scripts
      - name: Execute standalone TypeScript tests
        working-directory: web
        run: npm run test:logic

  dotnet:
    name: .NET build, xUnit and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: permora_ci
          POSTGRES_PASSWORD: permora_ci_isolated
          POSTGRES_DB: permora_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U permora_ci -d permora_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PERMORA_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=permora_test_ci;Username=permora_ci;Password=permora_ci_isolated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Restore exact committed NuGet dependencies
        run: dotnet restore Permora.slnx --locked-mode --verbosity minimal
      - name: Build all .NET projects (warnings are errors)
        run: dotnet build Permora.slnx -c Release --no-restore
      - name: xUnit including real PostgreSQL integration
        run: dotnet test tests/Permora.Tests/Permora.Tests.csproj -c Release --no-build --logger "trx;LogFileName=permora.trx"
      - name: Check that PostgreSQL integration was not silently skipped
        if: success()
        run: python3 scripts/ci-verify-trx.py tests/Permora.Tests/TestResults
      - name: Exercise ASP.NET API over HTTP with two scoped test identities
        run: python3 scripts/ci-api-smoke.py
      - name: Recovery smoke - isolated PostgreSQL backup and restore
        env:
          PERMORA_CI_PGHOST: 127.0.0.1
          PERMORA_CI_PGPORT: '5432'
          PERMORA_CI_PGUSER: permora_ci
          PERMORA_CI_PGPASSWORD: permora_ci_isolated
          PERMORA_CI_PGDATABASE: permora_test_ci
        run: bash scripts/ci-database-recovery.sh
      - name: Summarize local test evidence without upload
        if: always()
        shell: bash
        run: |
          echo "### .NET / PostgreSQL" >> "$GITHUB_STEP_SUMMARY"
          if find tests/Permora.Tests/TestResults -type f -name '*.trx' -print -quit 2>/dev/null | grep -q .; then
            echo "xUnit TRX produced locally; see job logs for results. No Actions artifact was saved." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No TRX report generated (review test/restore steps above)." >> "$GITHUB_STEP_SUMMARY"
          fi

  oidc-bff:
    name: Real Keycloak BFF OIDC sign-in and assurance gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: permora_ci
          POSTGRES_PASSWORD: permora_ci_isolated
          POSTGRES_DB: permora_test_ci_oidc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U permora_ci -d permora_test_ci_oidc"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PERMORA_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=permora_test_ci_oidc;Username=permora_ci;Password=permora_ci_isolated
      PERMORA_TEST_KC_URL: http://127.0.0.1:18080
      PERMORA_TEST_KC_USERNAME: ci-admin
      PERMORA_TEST_KC_PASSWORD: permora-ci-ephemeral-only
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install headless Chromium for a real browser OIDC session
        working-directory: web
        run: |
          npm ci --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=120000
          npx playwright install chromium --with-deps
      - name: Restore and build actual ASP.NET BFF and migration worker
        run: |
          dotnet restore Permora.slnx --locked-mode --verbosity minimal
          dotnet build Permora.slnx -c Release --no-restore
      - name: Launch isolated Keycloak browser identity provider
        run: |
          docker run --detach --rm --name permora-bff-idp             -p 127.0.0.1:18080:8080             -e KC_BOOTSTRAP_ADMIN_USERNAME="$PERMORA_TEST_KC_USERNAME"             -e KC_BOOTSTRAP_ADMIN_PASSWORD="$PERMORA_TEST_KC_PASSWORD"             quay.io/keycloak/keycloak:26.8.1 start-dev
      - name: Real OIDC code flow, cookie, CSRF, and insufficient assurance denial
        run: python3 scripts/ci-oidc-bff.py
      - name: Stop disposable IdP
        if: always()
        run: docker rm -f permora-bff-idp 2>/dev/null || true

  angular:
    name: Angular 22, frontend logic and Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact committed npm dependencies
        working-directory: web
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=120000
      - name: Unit tests without a browser
        working-directory: web
        run: npm run test:logic
      - name: Compile production Angular templates
        working-directory: web
        run: npm run build
      - name: Install Chromium and OS dependencies
        working-directory: web
        run: npx playwright install chromium --with-deps
      - name: Desktop and mobile Playwright
        working-directory: web
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Audit production npm dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Summarize Playwright evidence without upload
        if: always()
        shell: bash
        run: |
          echo "### Angular / Playwright" >> "$GITHUB_STEP_SUMMARY"
          if test -f web/playwright-report/index.html; then
            echo "Browser report generated locally; results are available in job logs. No Actions artifact was saved." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Browser report unavailable (inspect the Angular test steps)." >> "$GITHUB_STEP_SUMMARY"
          fi

  keycloak:
    name: Keycloak 26.8.1 FGAP, roles and token contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PERMORA_TEST_KC_URL: http://127.0.0.1:18080
      PERMORA_TEST_KC_USERNAME: ci-admin
      PERMORA_TEST_KC_PASSWORD: permora-ci-ephemeral-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Launch isolated Keycloak without external credentials
        run: |
          docker run --detach --rm --name permora-keycloak-ci \
            -p 127.0.0.1:18080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME="$PERMORA_TEST_KC_USERNAME" \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$PERMORA_TEST_KC_PASSWORD" \
            quay.io/keycloak/keycloak:26.8.1 start-dev
      - name: Verify live Keycloak Admin REST and OIDC semantics
        run: python3 scripts/ci-keycloak-contract.py
      - name: Collect isolated Keycloak diagnostic logs
        if: failure()
        run: docker logs --tail 150 permora-keycloak-ci 2>&1 | sed -E 's/(access_token|refresh_token|client_secret)[^[:space:]]*/[REDACTED]/g' || true
      - name: Stop isolated test server
        if: always()
        run: docker rm -f permora-keycloak-ci 2>/dev/null || true

  container:
    name: Docker production image (build only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build actual frontend and backend in the locked Docker image
        run: docker build --pull -f deploy/Dockerfile --build-arg PROJECT=Permora.Api -t permora-ci:local .
      - name: Verify frontend/backend packaging and non-root runtime user
        shell: bash
        run: |
          docker run --rm --entrypoint /bin/sh permora-ci:local -ec 'test -f /app/Permora.Api.dll && test -f /app/wwwroot/index.html'
          image_user="$(docker image inspect --format '{{.Config.User}}' permora-ci:local)"
          test -n "$image_user" && test "$image_user" != "root" && test "$image_user" != "0"

  dependency-locks:
    name: Release gate - committed NuGet and npm lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require reproducible committed dependency locks
        run: python3 scripts/ci-require-locks.py
      - name: Verify lockfile SBOM generation (NuGet and npm inventory only)
        run: |
          python3 -m unittest discover -s scripts -p "test_sbom.py"
          python3 scripts/generate_sbom.py --output "$RUNNER_TEMP/permora-lockfile-sbom.cdx.json"


  scope-summary:
    name: Explicit CI coverage boundaries
    if: always()
    needs: [structure, dotnet, oidc-bff, angular, keycloak, container, dependency-locks]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Explain covered and uncovered verification
        env:
          STRUCTURE_RESULT: ${{ needs.structure.result }}
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          OIDC_RESULT: ${{ needs.oidc-bff.result }}
          ANGULAR_RESULT: ${{ needs.angular.result }}
          KEYCLOAK_RESULT: ${{ needs.keycloak.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          LOCKS_RESULT: ${{ needs.dependency-locks.result }}
        run: |
          {
            echo "## Permora CI verification"
            echo
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Repository and isolated TypeScript | $STRUCTURE_RESULT |"
            echo "| C# build, xUnit, PostgreSQL | $DOTNET_RESULT |"
            echo "| Real Keycloak BFF login and insufficient ACR denial | $OIDC_RESULT |"
            echo "| Angular build and Playwright | $ANGULAR_RESULT |"
            echo "| Keycloak roles and OIDC token scope | $KEYCLOAK_RESULT |"
            echo "| Docker production image (no registry push) | $CONTAINER_RESULT |"
            echo "| Committed, reproducible dependency locks | $LOCKS_RESULT |"
            echo
            echo "**Not covered by a green workflow:** successful MFA/step-up at production LoA, full delegated FGAP user/group mapping,"
            echo "complete LDAP visibility, full production MFA,"
            echo "external directory/HR writeback, SoD drift under changing external groups,"
            echo "load/HA/restore/penetration testing, and production deployment."
            echo "No production secrets, deployments, or publishing are used."
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$STRUCTURE_RESULT" "$DOTNET_RESULT" "$OIDC_RESULT" "$ANGULAR_RESULT" "$KEYCLOAK_RESULT" "$CONTAINER_RESULT" "$LOCKS_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A mandatory Permora CI job failed, was cancelled, or was skipped. See the per-job results above."
              exit 1
            fi
          done
